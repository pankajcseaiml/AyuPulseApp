# Render Blueprint for AyuPulseApp Backend
# Deploy with: render blueprint

services:
  - type: web
    name: ayupulse-backend
    env: python
    region: oregon  # or singapore, frankfurt, etc.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URL
        sync: false
        description: MongoDB Atlas connection string
      - key: SECRET_KEY
        generateValue: true
        description: JWT secret key for authentication
      - key: DEBUG
        value: "false"
        description: Debug mode (false for production)
      - key: BACKEND_CORS_ORIGINS
        value: "https://ayu-pulse-app.vercel.app,https://ayupulseapp.vercel.app,http://localhost:5174"
        description: Allowed CORS origins
      - key: PROJECT_NAME
        value: "AyuPulseApp"
        description: Project name
      - key: VERSION
        value: "1.0.0"
        description: Application version
      - key: API_V1_STR
        value: "/api/v1"
        description: API version prefix
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
        description: JWT token expiration in minutes
      - key: ALGORITHM
        value: "HS256"
        description: JWT algorithm
      - key: UPLOAD_DIR
        value: "./uploads"
        description: Directory for uploaded files
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
        description: Maximum upload size in bytes (10MB)
      - key: LOG_LEVEL
        value: "INFO"
        description: Logging level

    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

    # Scaling
    plan: free
    numInstances: 1